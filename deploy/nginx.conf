# Поддомен ai.qtool.ru -> приложение на 127.0.0.1:8000. Сертификат: certbot --nginx -d ai.qtool.ru
server {
    listen 80;
    server_name ai.qtool.ru;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name ai.qtool.ru;
    # ssl_certificate / ssl_certificate_key — добавит certbot

    # X-Forwarded-For обязателен и для админки: без него приложение видит запрос с 127.0.0.1 и считает его локальным
    location /api/admin/ { allow 203.0.113.10; deny all; proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location /admin       { allow 203.0.113.10; deny all; proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # приложение берёт IP из этого заголовка (TRUST_PROXY=1)
        proxy_read_timeout 40s;
        client_max_body_size 1m;
    }
    location ~ ^/(data|src|\.env) { return 404; }
}
