<!-- Вставка на qtool.ru (шаблон сайта, перед </body>): плавающая кнопка и окно чата. Пока ai.qtool.ru не готов — не вставлять. -->
<button id="ai-open" style="position:fixed;right:16px;bottom:16px;z-index:9999;padding:12px 16px;border:0;border-radius:24px;background:#c8102e;color:#fff;font:600 15px system-ui;cursor:pointer">Подобрать пластину</button>
<div id="ai-box" style="display:none;position:fixed;right:16px;bottom:70px;z-index:9999;width:min(420px,calc(100vw - 32px));height:min(640px,calc(100vh - 100px));border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.3);background:#fff">
  <iframe src="https://ai.qtool.ru/" style="width:100%;height:100%;border:0" title="Подбор пластин"></iframe>
</div>
<script>document.getElementById('ai-open').onclick=function(){var b=document.getElementById('ai-box');b.style.display=b.style.display==='none'?'block':'none'}</script>
